name: CI

on:
    workflow_dispatch:
    # Validate workflow and build-system changes on the default branch without
    # entering the publishing workflow.
    push:
        branches:
            - '2.0'
        paths:
            - '.github/**'
            - 'gradle/wrapper/**'
            - 'gradlew'
            - 'gradlew.bat'
    pull_request:
        branches:
            - '2.0'

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  # Validation runs do not require a cache encryption secret.
                  cache-read-only: true

            - name: Build
              run: ./gradlew build --no-daemon --configuration-cache
